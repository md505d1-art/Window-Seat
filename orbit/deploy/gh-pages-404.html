<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <script>
    // GitHub Pages serves this file for unknown paths. Orbit is a single-page app under /orbit/,
    // so send deep links (e.g. /orbit/flip/items/123) to the app, which restores the path.
    (function () {
      var p = location.pathname, i = p.indexOf('/orbit/')
      if (i >= 0) location.replace(p.slice(0, i) + '/orbit/?redirect=' + encodeURIComponent(p.slice(i + 7) + location.search) + location.hash)
    })()
  </script>
  <style>body{font:16px system-ui,sans-serif;background:#0b0d12;color:#f8fafc;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#a78bfa}</style>
</head>
<body>
  <p>That page doesn’t exist. <a href="./">Go to the home page</a>.</p>
</body>
</html>
